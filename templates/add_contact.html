{% extends "base.html" %}

{% block title %}Add Contact - CRM System{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Add New Contact</h1>
</div>

<div class="form-container">
    <form action="{{ url_for('add_contact') }}" method="post" class="contact-form">
        <div class="form-group">
            <label for="name">Name <span class="required">*</span></label>
            <input type="text" id="name" name="name" required class="form-input">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-input">
        </div>

        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" class="form-input">
        </div>

        <div class="form-group">
            <label for="company">Company</label>
            <input type="text" id="company" name="company" class="form-input">
        </div>

        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="5" class="form-input"></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Add Contact</button>
            <a href="{{ url_for('index') }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
