{% extends "base.html" %}

{% block title %}Edit Contact - CRM System{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit Contact</h1>
</div>

<div class="form-container">
    <form action="{{ url_for('edit_contact', contact_id=contact.id) }}" method="post" class="contact-form">
        <div class="form-group">
            <label for="name">Name <span class="required">*</span></label>
            <input type="text" id="name" name="name" value="{{ contact.name }}" required class="form-input">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ contact.email or '' }}" class="form-input">
        </div>

        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" value="{{ contact.phone or '' }}" class="form-input">
        </div>

        <div class="form-group">
            <label for="company">Company</label>
            <input type="text" id="company" name="company" value="{{ contact.company or '' }}" class="form-input">
        </div>

        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="5" class="form-input">{{ contact.notes or '' }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Update Contact</button>
            <a href="{{ url_for('view_contact', contact_id=contact.id) }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
